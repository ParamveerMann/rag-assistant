<!doctype html><html><head><meta charset="utf-8"><title>Knowledge Assistant</title>
<style>body{font-family:system-ui;max-width:760px;margin:2rem auto;padding:0 1rem}
section{border:1px solid #ccc;border-radius:8px;padding:1rem;margin-bottom:1rem}
input[type=text]{width:75%;padding:.5rem}button{padding:.5rem 1rem}
pre{white-space:pre-wrap;background:#f5f5f5;padding:.75rem;border-radius:6px}</style></head>
<body><h1>Enterprise AI Knowledge Assistant</h1>
<section><h3>1. Upload a PDF</h3><input type="file" id="f" accept=".pdf">
<button onclick="up()">Upload</button><p id="u"></p></section>
<section><h3>2. Ask a question</h3><input type="text" id="q" placeholder="Ask about your documents">
<button onclick="ask()">Ask</button><pre id="a"></pre></section>
<script>
async function up(){const f=document.getElementById('f').files[0];if(!f)return;
const fd=new FormData();fd.append('file',f);u.textContent='Uploading...';
const r=await fetch('/upload',{method:'POST',body:fd});const j=await r.json();
u.textContent=r.ok?`Indexed ${j.chunks} chunks from ${j.filename}`:(j.detail||'Error');}
async function ask(){a.textContent='Thinking...';
const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({question:q.value})});const j=await r.json();
a.textContent=r.ok?j.answer+'\n\nSources: '+j.sources.map(s=>`${s.source} p.${s.page}`).join(', '):(j.detail||'Error');}
</script></body></html>
