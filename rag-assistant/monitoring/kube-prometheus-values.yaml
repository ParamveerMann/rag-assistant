grafana:
  adminPassword: admin
  sidecar:
    dashboards: {enabled: true, label: grafana_dashboard}
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
